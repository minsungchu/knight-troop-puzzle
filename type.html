<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타자 도장 — 익히기 · 낱말 · 글쓰기 · 성 지키기 · 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/type.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>타자 도장</h1>
      <div class="sub">TYPING DOJO · 한글 · ABC</div>
    </div>

    <nav class="tabs" role="tablist" aria-label="화면 전환">
      <a class="tab tab-home" href="./" aria-label="게임 고르기로">◂ 게임</a>
      <button class="tab on" data-tab="practice" role="tab" aria-selected="true">익히기</button>
      <button class="tab" data-tab="words" role="tab" aria-selected="false">낱말</button>
      <button class="tab" data-tab="write" role="tab" aria-selected="false">글쓰기</button>
      <button class="tab" data-tab="castle" role="tab" aria-selected="false">성 지키기</button>
      <button class="tab" data-tab="duel" role="tab" aria-selected="false">대결</button>
    </nav>

    <div class="account" id="account"></div>
  </header>

  <!-- 지금 기록이 어디에 남는지 — 화면 위에 늘 적어 둔다 -->
  <div id="saveNote"></div>

  <div class="ty-need-kb" id="tyNeedKeyboard" hidden>
    <p><b>화면 아래 자판을 손가락으로 눌러</b> 치면 됩니다.
      숫자·문장부호는 <b>!#1</b>, 쌍자음은 <b>⇧</b> 를 먼저.</p>
    <button class="btn" id="tyTipOk">알겠어요</button>
  </div>

  <!-- ══════════════ 자리 익히기 ══════════════ -->
  <section class="view" data-view="practice">
    <div id="tyMap"></div>
    <div id="tyPlay" hidden></div>
  </section>

  <!-- ══════════════ 낱말 연습 ══════════════ -->
  <section class="view" data-view="words" hidden>
    <div id="tyWordHome"></div>
    <div id="tyWordPlay" hidden></div>
  </section>

  <!-- ══════════════ 글쓰기 ══════════════ -->
  <section class="view" data-view="write" hidden>
    <div id="tyWriteHome"></div>
    <div id="tyWritePlay" hidden></div>
  </section>

  <!-- ══════════════ 성 지키기 ══════════════ -->
  <section class="view" data-view="castle" hidden>
    <div id="tyGameHome"></div>
    <div id="tyGamePlay" hidden></div>
  </section>

  <!-- ══════════════ 대결 ══════════════ -->
  <section class="view" data-view="duel" hidden>
    <div id="tyDuelBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="veil" id="veil"><div class="card" id="card"></div></div>

<script type="module" src="js/type/main.js"></script>
</body>
</html>

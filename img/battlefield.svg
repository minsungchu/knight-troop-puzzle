<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- 해질 무렵의 평야 전장.

     깊이는 '대기 원근'으로 낸다 — 능선을 여러 겹 두고, 멀수록 밝고 흐리게,
     겹 사이마다 옅은 안개 띠를 깐다. 실루엣만 겹치면 평면으로 보인다.
     구름·연기·땅은 feTurbulence 로 결을 만들어 벡터 특유의 매끈함을 없앴다.
     해는 능선에 반쯤 걸려 역광을 만들고, 그 빛이 안개를 타고 부챗살로 퍼진다. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#05070d"/>
    <stop offset=".22"  stop-color="#0b1220"/>
    <stop offset=".42"  stop-color="#182036"/>
    <stop offset=".60"  stop-color="#33314a"/>
    <stop offset=".71"  stop-color="#634150"/>
    <stop offset=".78"  stop-color="#96603c"/>
    <stop offset="1"    stop-color="#d08b45"/>
  </linearGradient>

  <radialGradient id="bloom" cx=".5" cy=".5" r=".5">
    <stop offset="0"   stop-color="#ffe0a8" stop-opacity=".95"/>
    <stop offset=".18" stop-color="#ffc06a" stop-opacity=".55"/>
    <stop offset=".55" stop-color="#e07f36" stop-opacity=".22"/>
    <stop offset="1"   stop-color="#c9793a" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#e8c79a" stop-opacity="0"/>
    <stop offset=".55" stop-color="#e8c79a" stop-opacity=".30"/>
    <stop offset="1"   stop-color="#e8c79a" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#4a3320"/>
    <stop offset=".14" stop-color="#241d17"/>
    <stop offset=".55" stop-color="#10131a"/>
    <stop offset="1"   stop-color="#05070d"/>
  </linearGradient>

  <radialGradient id="vig" cx=".5" cy=".40" r=".86">
    <stop offset="0"   stop-color="#05070d" stop-opacity="0"/>
    <stop offset=".46" stop-color="#05070d" stop-opacity=".24"/>
    <stop offset="1"   stop-color="#05070d" stop-opacity=".92"/>
  </radialGradient>

  <!-- 구름 결 -->
  <filter id="cloud" x="-10%" y="-40%" width="120%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency=".004 .018" numOctaves="4" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="6"/>
  </filter>

  <!-- 연기 기둥 -->
  <filter id="smoke" x="-60%" y="-20%" width="220%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .006" numOctaves="4" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="9"/>
  </filter>

  <!-- 땅의 거친 결 -->
  <filter id="soil" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9 .12" numOctaves="3" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".10"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="atop"/>
  </filter>

  <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="softer"><feGaussianBlur stdDeviation="5"/></filter>

  <!-- 부챗살은 하늘 안에만 보이게 -->
  <clipPath id="skyClip"><rect x="0" y="0" width="1600" height="700"/></clipPath>

  <!-- 창 한 자루 -->
  <g id="spear"><path d="M0 0v-26" stroke-linecap="round"/></g>
</defs>

<!-- ── 하늘 ── -->
<rect width="1600" height="900" fill="url(#sky)"/>

<!-- 역광 부챗살 -->
<g clip-path="url(#skyClip)" opacity=".5">
  <g fill="#ffcf86" filter="url(#softer)">
    <path d="M860 690 L560 40 L640 40Z" opacity=".07"/>
    <path d="M860 690 L720 20 L790 20Z" opacity=".09"/>
    <path d="M860 690 L900 10 L980 10Z" opacity=".08"/>
    <path d="M860 690 L1080 60 L1170 60Z" opacity=".06"/>
    <path d="M860 690 L1290 150 L1400 150Z" opacity=".05"/>
    <path d="M860 690 L330 190 L420 190Z" opacity=".05"/>
  </g>
</g>

<!-- 해무리 -->
<ellipse cx="860" cy="690" rx="430" ry="230" fill="url(#bloom)"/>
<circle cx="860" cy="688" r="46" fill="#ffdca0" opacity=".85" filter="url(#soft)"/>

<!-- 구름 — 역광이라 아래쪽만 붉게 트인다 -->
<g filter="url(#cloud)">
  <g fill="#0a0f1c" opacity=".85">
    <ellipse cx="380" cy="210" rx="430" ry="34"/>
    <ellipse cx="1240" cy="168" rx="360" ry="26"/>
    <ellipse cx="820" cy="300" rx="520" ry="30"/>
    <ellipse cx="300" cy="392" rx="340" ry="22"/>
    <ellipse cx="1330" cy="410" rx="330" ry="20"/>
  </g>
  <g fill="#c2764a" opacity=".30">
    <ellipse cx="820" cy="322" rx="470" ry="10"/>
    <ellipse cx="1330" cy="428" rx="300" ry="8"/>
    <ellipse cx="300" cy="410" rx="300" ry="8"/>
  </g>
</g>

<!-- ── 능선 다섯 겹 ── 멀수록 밝고 흐리다 -->
<path fill="#3d4a68" opacity=".45" filter="url(#soft)"
      d="M0 646 L150 566 L286 620 L430 540 L580 616 L706 566 L860 628 L1000 572
         L1140 620 L1280 552 L1420 614 L1600 566 L1600 700 L0 700Z"/>
<rect x="0" y="612" width="1600" height="70" fill="url(#haze)" opacity=".85"/>

<path fill="#2a3450" opacity=".7" filter="url(#soft)"
      d="M0 668 L170 618 L320 660 L480 606 L640 656 L800 620 L960 662
         L1120 614 L1290 658 L1450 622 L1600 664 L1600 720 L0 720Z"/>
<rect x="0" y="640" width="1600" height="62" fill="url(#haze)" opacity=".7"/>

<!-- 군대가 늘어선 능선 -->
<path fill="#18202f"
      d="M0 692 L200 664 L380 690 L560 660 L740 692 L920 666 L1100 694
         L1290 664 L1470 692 L1600 674 L1600 740 L0 740Z"/>

<!-- 능선 뒤에서 오르는 연기 -->
<g filter="url(#smoke)" opacity=".3">
  <path fill="#8e8577" d="M470 690c10-90 -22-150 6-230 26 76 40 150 22 230z"/>
  <path fill="#8e8577" d="M1030 694c14-110 -18-170 10-262 30 92 40 176 20 262z"/>
  <path fill="#7d7568" d="M1340 692c8-70 -14-118 4-180 20 60 30 120 14 180z"/>
</g>

<!-- 늘어선 군대 — 창만 그리면 울타리로 보인다. 아래에 병력 덩어리를 깐다. -->
<g fill="#0d131e" opacity=".85">
  <rect x="150" y="676" width="330" height="20" rx="8"/>
  <rect x="560" y="672" width="360" height="20" rx="8"/>
  <rect x="960" y="680" width="340" height="20" rx="8"/>
  <rect x="1320" y="674" width="240" height="18" rx="8"/>
</g>
<g fill="#111925" opacity=".7">
  <rect x="230" y="662" width="220" height="14" rx="6"/>
  <rect x="640" y="658" width="240" height="14" rx="6"/>
  <rect x="1020" y="666" width="230" height="14" rx="6"/>
</g>

<!-- 먼 열 — 작고 흐리다 -->
<g stroke="#0c111b" stroke-width="1.5" opacity=".5">
  <path d="M240 662v-12M254 660v-9M268 663v-13M282 659v-9M296 662v-11M310 660v-9M324 663v-12
           M650 658v-12M664 656v-9M678 659v-13M692 655v-8M706 658v-11M720 656v-9
           M1030 666v-12M1044 664v-9M1058 667v-13M1072 663v-8M1086 666v-11M1100 664v-9"/>
</g>
<!-- 앞 열 — 크고 진하다 -->
<g stroke="#070c14" stroke-width="2.6" opacity=".9">
  <path d="M175 676v-24M197 672v-19M219 676v-26M241 671v-17M263 676v-22M285 673v-18M307 676v-25M329 672v-19
           M585 672v-24M607 668v-18M629 672v-27M651 667v-16M673 672v-22M695 669v-19M717 672v-25
           M985 680v-24M1007 676v-19M1029 680v-27M1051 675v-17M1073 680v-22M1095 677v-18
           M1345 674v-22M1367 671v-17M1389 674v-24M1411 670v-16"/>
</g>

<!-- 군기 -->
<g opacity=".92">
  <g stroke="#070c14" stroke-width="3.2">
    <path d="M219 676v-54M629 672v-60M1029 680v-56M1389 674v-48"/>
  </g>
  <g fill="#9a6a2e">
    <path d="M219 622h36l-12 14 12 14h-36z"/>
    <path d="M629 612h34l-11 13 11 13h-34z"/>
    <path d="M1029 624h34l-11 13 11 13h-34z"/>
    <path d="M1389 626h30l-10 12 10 12h-30z"/>
  </g>
</g>

<!-- 능선 앞 안개 — 군대의 발치를 지운다 -->
<rect x="0" y="682" width="1600" height="54" fill="url(#haze)" opacity=".85"/>

<!-- ── 평야 ── -->
<rect x="0" y="716" width="1600" height="184" fill="url(#ground)"/>
<rect x="0" y="716" width="1600" height="184" fill="#2a2118" filter="url(#soil)" opacity=".5"/>

<!-- 수레바퀴 자국 — 지평선 한 점으로 모인다 -->
<g stroke="#6b5232" stroke-width="2" opacity=".22" fill="none">
  <path d="M860 716 L40 900M860 716 L360 900M860 716 L640 900
           M860 716 L1010 900M860 716 L1240 900M860 716 L1560 900"/>
</g>
<g stroke="#0a0d13" stroke-width="1.4" opacity=".45">
  <path d="M0 760h1600M0 806h1600M0 862h1600"/>
</g>

<!-- ── 전경 ── 앞뒤를 갈라 깊이를 만든다. 좌우가 잘려도 남도록 안쪽에 둔다. -->
<g fill="#04060b">
  <!-- 부러진 창과 방패 -->
  <path d="M286 900l16-158 12 2-12 156z"/>
  <path d="M296 746l-18-36 32 6z"/>
  <path d="M352 900c-7-46 11-78 44-80 33 2 51 34 44 80z"/>
  <path d="M1264 900l-20-176 12-2 20 178z"/>
  <path d="M1256 726l12-40 18 32z"/>
  <!-- 죽은 나무 -->
  <path d="M1130 900l11-128 11 2-9 126z"/>
  <path d="M1143 794l-44-38 7-11 44 36z"/>
  <path d="M1147 822l42-31 7 11-44 31z"/>
  <path d="M1141 768l-29-44 9-7 29 44z"/>
</g>

<!-- 까마귀 -->
<g stroke="#070b13" stroke-width="2.4" fill="none" opacity=".75">
  <path d="M420 236c6-7 12-7 18 0 6-7 12-7 18 0"/>
  <path d="M498 194c5-6 10-6 15 0 5-6 10-6 15 0"/>
  <path d="M1140 262c5-6 10-6 15 0 5-6 10-6 15 0"/>
  <path d="M1206 214c4-5 8-5 12 0 4-5 8-5 12 0"/>
</g>

<rect width="1600" height="900" fill="url(#vig)"/>
</svg>

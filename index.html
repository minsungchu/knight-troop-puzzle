<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퍼즐 전장 — 게임 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/hub.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>퍼즐 전장</h1>
      <div class="sub">PUZZLE BATTLEFIELD</div>
    </div>
    <div class="account" id="account"></div>
  </header>

  <div class="hub">
    <a class="game-card" href="knight.html">
      <!-- 나이트 걸음이 닿는 칸을 그대로 그림으로 쓴다. 무슨 게임인지 한눈에 보이게. -->
      <svg class="game-art" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2d4159"/><stop offset="1" stop-color="#1a2739"/>
          </linearGradient>
        </defs>
        <rect x="10" y="10" width="100" height="100" rx="8" fill="url(#kg)"/>
        <g fill="none" stroke="rgba(201,151,63,.28)" stroke-width="1">
          <path d="M35 10v100M60 10v100M85 10v100M10 35h100M10 60h100M10 85h100"/>
        </g>
        <g stroke="rgba(255,231,178,.3)" stroke-width="1.5" fill="none">
          <path d="M47.5 72.5L72.5 47.5M47.5 72.5L22.5 47.5M47.5 72.5L72.5 97.5"/>
        </g>
        <circle cx="47.5" cy="72.5" r="11" fill="#c9973f" opacity=".92"/>
        <g fill="rgba(255,231,178,.55)">
          <circle cx="72.5" cy="47.5" r="5"/><circle cx="22.5" cy="47.5" r="5"/>
          <circle cx="72.5" cy="97.5" r="5"/><circle cx="22.5" cy="97.5" r="5"/>
        </g>
      </svg>
      <div class="game-text">
        <h2>나이트 부대 배치</h2>
        <p>나이트 걸음이 닿는 칸에는 같은 부대를 두지 못한다. 한 줄에 셋이 잇달아도 안 된다.</p>
        <div class="game-tags"><span>논리</span><span>5×5 ~ 12×12</span><span>랭킹 · 대전</span></div>
      </div>
    </a>

    <a class="game-card" href="laser.html">
      <svg class="game-art" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2d4159"/><stop offset="1" stop-color="#1a2739"/>
          </linearGradient>
        </defs>
        <rect x="10" y="10" width="100" height="100" rx="8" fill="url(#lg)"/>
        <g fill="none" stroke="rgba(201,151,63,.28)" stroke-width="1">
          <path d="M35 10v100M60 10v100M85 10v100M10 35h100M10 60h100M10 85h100"/>
        </g>
        <!-- 거울에 두 번 꺾여 목표로 들어가는 빛 -->
        <g fill="none" stroke-linecap="round">
          <path d="M10 22.5H72.5V72.5H97.5" stroke="#ffd98a" stroke-width="9" opacity=".12"/>
          <path d="M10 22.5H72.5V72.5H97.5" stroke="#ffd98a" stroke-width="4" opacity=".3"/>
          <path d="M10 22.5H72.5V72.5H97.5" stroke="#fff6df" stroke-width="1.6" opacity=".95"/>
        </g>
        <g stroke="#dfe9f5" stroke-width="3" stroke-linecap="round">
          <path d="M67 28l11-11"/><path d="M67 78l11-11"/>
        </g>
        <circle cx="97.5" cy="72.5" r="7" fill="none" stroke="#6fe3b0" stroke-width="3"/>
      </svg>
      <div class="game-text">
        <h2>레이저 미로</h2>
        <p>거울을 놓아 빛을 꺾는다. 주어진 거울을 하나도 남기지 말고, 모든 목표를 밝혀라.</p>
        <div class="game-tags"><span>길찾기</span><span>100단계</span><span>대전 · 급수</span></div>
      </div>
    </a>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="veil" id="veil"><div class="card" id="card"></div></div>

<script type="module" src="js/hub.js"></script>
</body>
</html>
